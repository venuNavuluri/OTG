<template>
    <lightning-quick-action-panel header="Confirm Termination">
        <template lwc:if={isValidating}>
            <div class="slds-m-bottom_medium slds-align_absolute-center">
                <lightning-spinner size="small" alternative-text="Validating open Quotes or Orders"></lightning-spinner>
            </div>
        </template>

        <template lwc:if={hasWarnings}>
            <div class="warning-banner slds-notify slds-notify_alert slds-m-bottom_medium" role="alert">
                <span class="slds-assistive-text">Warning</span>
                <div>
                    <template for:each={warnings} for:item="item">
                        <div key={item} class="slds-m-bottom_x-small">
                            <lightning-formatted-rich-text value={item}></lightning-formatted-rich-text>
                        </div>
                    </template>
                </div>
            </div>
        </template>

        <template lwc:elseif={showTerminationForm}>
            <div class="slds-m-bottom_medium termination-choice">
                <fieldset>
                    <legend class="slds-form-element__legend slds-form-element__label">
                        <abbr class="slds-required" title="required">*</abbr>
                        Are you sure you want to terminate the installation?
                    </legend>
                    <div class="termination-choice__options">
                        <lightning-input
                            type="radio"
                            name="terminationConfirmation"
                            label="Yes"
                            value="Yes"
                            checked={isYesSelected}
                            onchange={onSelected}>
                        </lightning-input>
                        <lightning-input
                            type="radio"
                            name="terminationConfirmation"
                            label="No"
                            value="No"
                            checked={isNoSelected}
                            onchange={onSelected}>
                        </lightning-input>
                    </div>
                </fieldset>
            </div>

            <template lwc:if={showDetails}>
                <lightning-record-edit-form object-api-name="Installation__c">
                    <lightning-messages></lightning-messages>
                    <div class="slds-grid slds-wrap">
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-right_small">
                            <lightning-input-field
                                variant="label-stacked"
                                field-name="Termination_End_Date__c"
                                required
                                onchange={handleFieldChange}>
                            </lightning-input-field>
                            <template lwc:if={error}>
                                <span class="slds-text-color_error slds-m-top_x-small">
                                    <b>{errorMessage}</b>
                                </span>
                            </template>
                        </div>

                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-left_small">
                            <lightning-input-field
                                variant="label-stacked"
                                field-name="Termination_Reason__c"
                                required
                                onchange={handleFieldChange}>
                            </lightning-input-field>
                        </div>
                    </div>
                </lightning-record-edit-form>
            </template>
        </template>

        <div slot="footer" class="slds-align_absolute-center slds-m-top_medium">
            <lightning-button
                variant="neutral"
                label="Cancel"
                title="Cancel"
                onclick={cancel}
                class="slds-m-right_small">
            </lightning-button>
            <template lwc:if={showTerminationForm}>
                <lightning-button
                    variant="brand"
                    label="Save"
                    title="Save"
                    onclick={handleSave}
                    disabled={isSaveDisabled}>
                </lightning-button>
            </template>
        </div>
    </lightning-quick-action-panel>
</template>
