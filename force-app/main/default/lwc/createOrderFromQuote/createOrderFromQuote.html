<template>
  <template if:true={createOrderMsg}>
    <header class="slds-modal__header">
      <button
        class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
        title="Close"
        onclick={closeModal}
      >
        <lightning-icon
          icon-name="utility:close"
          alternative-text="close"
          variant="inverse"
          size="small"
        ></lightning-icon>
        <span class="slds-assistive-text">Close</span>
      </button>
      <h2 id="modal-heading-03" class="slds-text-heading_medium slds-hyphenate">
        Create Order
      </h2>
      <p class="slds-m-top_x-small slds-text-body_regular slds-text-color_weak">
        Review the service order requirement before creating the subscription order.
      </p>
    </header>

    <div
      class="slds-modal__content slds-p-around_large create-order-content"
      id="modal-content-id-4"
    >
      <template if:true={showValidationMessage}>
        <div class="message-panel message-panel_error">
          <lightning-icon
            icon-name="utility:error"
            size="small"
            variant="error"
            alternative-text="Error"
          ></lightning-icon>
          <div>
            <h3 class="slds-text-heading_small slds-m-bottom_x-small">
              Order cannot be created yet
            </h3>
            <lightning-formatted-rich-text
              value={message}
            ></lightning-formatted-rich-text>
          </div>
        </div>
      </template>

      <template if:true={showSuccessMessage}>
        <div class="message-panel message-panel_success">
          <lightning-icon
            icon-name="utility:success"
            size="small"
            variant="success"
            alternative-text="Success"
          ></lightning-icon>
          <div>
            <h3 class="slds-text-heading_small slds-m-bottom_x-small">
              Order request submitted
            </h3>
            <lightning-formatted-rich-text
              value={message}
            ></lightning-formatted-rich-text>
          </div>
        </div>
      </template>

      <template if:true={showServiceOrderStep}>
        <section class="step-panel">
          <div class="step-header">
            <span class="step-number">1</span>
            <div>
              <h3 class="slds-text-heading_small">Service order requirement</h3>
              <p class="slds-text-body_small slds-text-color_weak">
                Select whether Professional Services must complete implementation before subscription billing is controlled from installation lines.
              </p>
            </div>
          </div>

          <lightning-radio-group
            class="slds-m-top_medium"
            name="requiresServiceOrder"
            label="Does this quote require a Service Order?"
            options={serviceOrderOptions}
            value={serviceOrderRequirement}
            type="radio"
            required
            onchange={handleRequiresServiceOrderChange}
          >
          </lightning-radio-group>
        </section>
      </template>

      <template if:true={showConfirmationStep}>
        <section class="step-panel">
          <div class="step-header">
            <span class="step-number">2</span>
            <div>
              <h3 class="slds-text-heading_small">Confirm order creation</h3>
              <p class="slds-text-body_small slds-text-color_weak">
                Check the order behavior before continuing.
              </p>
            </div>
          </div>

          <dl class="confirmation-list slds-m-top_medium">
            <div>
              <dt>Requires Service Order</dt>
              <dd>{requiresServiceOrderLabel}</dd>
            </div>
            <div>
              <dt>Result</dt>
              <dd>{confirmationSummary}</dd>
            </div>
          </dl>

          <div class="message-panel message-panel_info slds-m-top_medium">
            <lightning-icon
              icon-name="utility:info"
              size="small"
              alternative-text="Information"
            ></lightning-icon>
            <p>
              Creating the order will mark the quote as ordered and start the existing CPQ order process.
            </p>
          </div>
        </section>
      </template>
    </div>

    <footer class="slds-modal__footer">
      <button
        if:true={showCloseButton}
        class="slds-button slds-button_neutral"
        onclick={closeModal}
        title="Close"
      >
        Close
      </button>

      <button
        if:true={showBackButton}
        class="slds-button slds-button_neutral"
        onclick={backToServiceOrderStep}
        title="Back"
      >
        Back
      </button>

      <button
        if:true={showCancelButton}
        class="slds-button slds-button_neutral"
        onclick={closeModal}
        title="Cancel"
      >
        Cancel
      </button>

      <button
        if:true={showContinueButton}
        class="slds-button slds-button_brand"
        onclick={goToConfirmationStep}
        disabled={isContinueDisabled}
        title="Continue"
      >
        Continue
      </button>

      <button
        if:true={showCreateButton}
        class="slds-button slds-button_brand"
        onclick={createOrder}
        disabled={isCreating}
        title="Create Order"
      >
        {createButtonLabel}
      </button>
    </footer>
  </template>
</template>
